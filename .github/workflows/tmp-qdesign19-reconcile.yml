name: Temporary Q-DESIGN-19 reconcile

on:
  push:
    branches:
      - queue/q-design-19-clr01-materialization

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: queue/q-design-19-clr01-materialization
      - name: Advance design queue and remove helper
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/reconcile.py
          python3 /tmp/reconcile.py
          git rm .github/workflows/tmp-qdesign19-reconcile.yml
          git add CURRENT_STATE.md docs/PROJECT_EXECUTION_QUEUE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Advance CLR-01 to materialization'
          git push origin HEAD:queue/q-design-19-clr01-materialization
