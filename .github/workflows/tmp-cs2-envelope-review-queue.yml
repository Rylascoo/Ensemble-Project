name: Temporary CS2 Director-review continuity reconcile

on:
  push:
    branches:
      - queue/cs2-envelope-director-review-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: queue/cs2-envelope-director-review-reconcile
      - name: Reconcile Q-DESIGN-16 review boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cs = Path('CURRENT_STATE.md')
          s = cs.read_text()
          old = 'Q-DESIGN-15 DONE; Q-DESIGN-16 ACTIVE under Website authority; CS2 Balanced Crossfade Exchange is provisional for eligible context shifts.'
          new = 'Q-DESIGN-15 DONE; Q-DESIGN-16 ACTIVE under Website authority at the direct Director adjudication gate. Website `main` `b24ca7ce1f9c20f3042b6f63193657acab66a559` carries the frozen CS2 envelope, clean 24/24 FULL + 24/24 REDUCED + retarget evidence, and Design Sol pre-Director view; CS2 Balanced Crossfade Exchange remains provisional for eligible context shifts.'
          if s.count(old) != 1:
              raise SystemExit('CURRENT_STATE expected cross-lane sentence not found exactly once')
          cs.write_text(s.replace(old, new))

          q = Path('docs/PROJECT_EXECUTION_QUEUE.md')
          s = q.read_text()
          old = '| Q-DESIGN-16 | Design Sol / Director | ACTIVE | Freeze and test the bounded CS2 deployment envelope: eligible context-shift classes, CUT fallback, repetition/interruption/retarget behavior, F1A relationship, reduced-motion equivalence and explicit prohibited uses. | Website Q-DESIGN-15 closure at `b66bb1b47c407d213c092d20ec603c1a9d56e5ca`. No production timing/easing/opacity tokens; no universal screen-crossfade rule; no app/site/navigation implementation; no F1A retune; no Character/Scene/Stage/Performance/Take/Opportunity motion; no final identity or Phase-C convergence. | Freeze a non-production use-envelope contract, materialize a small neutral allowed/negative-control exemplar set, pass full/reduced-motion preflight, then resolve the envelope through direct Design Sol + Director adjudication. |'
          new = '| Q-DESIGN-16 | Design Sol / Director | ACTIVE | Resolve the already-frozen CS2 deployment envelope through direct Director + Design Sol adjudication. Contract, six-case neutral exemplar, full/reduced-motion preflight, retarget checks, and Design Sol pre-Director view are complete. | Website `main` at `b24ca7ce1f9c20f3042b6f63193657acab66a559`; `docs/evidence/MOT_01_CS2_DEPLOYMENT_ENVELOPE_CONTRACT_01.json`, `docs/evidence/MOT_01_CS2_DEPLOYMENT_ENVELOPE_EXEMPLAR_PREFLIGHT_01.json`, `docs/evidence/MOT_01_CS2_DEPLOYMENT_ENVELOPE_DESIGN_SOL_VIEW_01.json`, and Design Ledger L-051. No post-view retuning; no production timing/easing/opacity tokens; no universal screen-crossfade rule; no app/site/navigation implementation; no F1A retune; no Character/Scene/Stage/Performance/Take/Opportunity motion; no final identity or Phase-C convergence. | Director approves, corrects, or rejects the frozen envelope after viewing the same exemplar; only then may Q-DESIGN-16 close or require bounded correction. |'
          if s.count(old) != 1:
              raise SystemExit('queue expected Q-DESIGN-16 row not found exactly once')
          q.write_text(s.replace(old, new))
          PY
          git rm .github/workflows/tmp-cs2-envelope-review-queue.yml
          git add CURRENT_STATE.md docs/PROJECT_EXECUTION_QUEUE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile CS2 envelope Director-review boundary'
          git push origin HEAD:queue/cs2-envelope-director-review-reconcile
