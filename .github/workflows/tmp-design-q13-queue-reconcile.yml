name: Temporary design Q13 queue reconciliation

on:
  push:
    branches:
      - queue/design-q13-f1a-deployment-envelope

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile Q-DESIGN-12 to Q-DESIGN-13
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/PROJECT_EXECUTION_QUEUE.md')
          text=p.read_text()
          lines=text.splitlines()
          out=[]
          found=False
          for line in lines:
              if line.startswith('| Q-DESIGN-12 |'):
                  found=True
                  out.append('| Q-DESIGN-12 | Design Sol / Director | DONE | Materialized and preflighted the deterministic 16-specimen labeled F1 refinement comparison, then resolved cadence through direct Design Sol + Director adjudication. | Closed on `Rylascoo/Ensemble-Website/main` at `fb253c0d7b70c592ad8b73bda0a87950d002a8dd`; `docs/evidence/MOT_01_F1_CADENCE_ADJUDICATION_01.json` preserves the clean 16/16 FULL + 16/16 REDUCED preflight, Design Sol F1B preference, Director F1A preference, and tie-rule reconciliation. | **F1A Tight** (70 ms onset interval / 460 ms equal movement / 670 ms last completion) is the provisional refinement reference, not a production token. Successor is Q-DESIGN-13. |')
                  out.append('| Q-DESIGN-13 | Design Sol / Director | ACTIVE | Freeze the bounded F1A deployment-envelope contract: eligible identity-bearing trigger zones, group-size/batching rules, repetition/frequency limits, interruption/replay behavior, logical/RTL ordering, and reduced-motion equivalence. | Preserve F1A mechanism/timing as the provisional reference while defining use boundaries only. No arbitrary-list/feed generalization, false loading/progress/priority/causal semantics, production motion tokens, Q-DESIGN-02 Stage motion, app implementation, website deployment, final identity or Phase-C convergence. | Clean audited deployment-envelope contract becomes the next design authority; any implementation or production-token work requires a separate successor gate. |')
              else:
                  out.append(line)
          if not found:
              raise SystemExit('Q-DESIGN-12 row not found')
          if any(line.startswith('| Q-DESIGN-13 |') for line in lines):
              raise SystemExit('Q-DESIGN-13 already exists unexpectedly')
          p.write_text('\n'.join(out)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-design-q13-queue-reconcile.yml
          git add docs/PROJECT_EXECUTION_QUEUE.md
          git commit -m 'Reconcile design queue to F1A deployment envelope'
          python3 tools/validate_repository_laws.py
          git push origin HEAD:queue/design-q13-f1a-deployment-envelope
