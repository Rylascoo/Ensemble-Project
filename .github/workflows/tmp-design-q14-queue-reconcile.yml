name: Temporary design Q14 queue reconciliation

on:
  push:
    branches:
      - queue/design-q14-f1a-envelope-exemplars

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Reconcile Q-DESIGN-13 to Q-DESIGN-14
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/PROJECT_EXECUTION_QUEUE.md')
          lines=p.read_text().splitlines()
          out=[]; found=False
          for line in lines:
              if line.startswith('| Q-DESIGN-13 |'):
                  found=True
                  out.append('| Q-DESIGN-13 | Design Sol / Director | DONE | Froze the bounded F1A deployment-envelope contract: identity-bearing trigger zones, 2–4 direct-unit law, grouped 5+ handling, repetition/interruption/order rules and reduced-motion equivalence. | Closed on `Rylascoo/Ensemble-Website/main` at `0fa245d6adc39a20b715c0b8b9cf32516d22b8cb`; `docs/evidence/MOT_01_F1A_DEPLOYMENT_ENVELOPE_CONTRACT_01.json`, Website `CURRENT_STATE.md`, and Design Ledger L-045 carry the authority. | Envelope frozen without production tokens or implementation; successor is Q-DESIGN-14. |')
                  out.append('| Q-DESIGN-14 | Design Sol / Director | ACTIVE | Materialize a small non-production F1A deployment-envelope exemplar set covering representative eligible use, legitimate grouped 5+ content and prohibited negative controls; pass structural/reduced-motion checks; present labeled examples for direct Design Sol + Director adjudication. | Preserve exact F1A 70/460 cadence and frozen envelope. Test use-boundary clarity only. No cadence reroll, production motion/displacement tokens, arbitrary-list/feed stagger, Stage motion, app/site implementation, final identity or Phase-C convergence. | Direct adjudication either confirms/corrects the envelope or identifies a bounded use-law defect. Any implementation/production-token work requires a separate successor gate. |')
              else:
                  out.append(line)
          if not found: raise SystemExit('Q-DESIGN-13 row not found')
          if any(line.startswith('| Q-DESIGN-14 |') for line in lines): raise SystemExit('Q-DESIGN-14 already exists unexpectedly')
          p.write_text('\n'.join(out)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-design-q14-queue-reconcile.yml
          git add docs/PROJECT_EXECUTION_QUEUE.md
          git commit -m 'Reconcile design queue to F1A envelope exemplars'
          git push origin HEAD:queue/design-q14-f1a-envelope-exemplars
