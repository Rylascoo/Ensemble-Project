name: Temporary Q-DESIGN-12 queue materialization
on:
  push:
    branches:
      - tmp/design-q12-queue-materialize
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Reconcile design queue and continuity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          q = Path('docs/PROJECT_EXECUTION_QUEUE.md')
          text = q.read_text(encoding='utf-8')
          lines = text.splitlines()
          out = []
          replaced = False
          for line in lines:
              if line.startswith('| Q-DESIGN-11 |'):
                  out.append('| Q-DESIGN-11 | Design Sol / Director | DONE | Constructed the F1 Ordered Stagger semantic/refinement contract around its Director-selected one-after-another symbolism. | Closed on `Rylascoo/Ensemble-Website/main` at `b3377ba79d50b7da98b6d33dd11b977695e466f3`; `docs/evidence/MOT_01_F1_ORDERED_STAGGER_REFINEMENT_CONTRACT_01.json` freezes symbolic-use zones, false-literal-state exclusions, F1A 70/460, F1B 90/520 reference, F1C 110/560, unchanged F4 reference, displacement-only WEB/APP adaptation and reduced-motion law. No production/Stage/implementation authority. | Contract frozen and recursively clean; successor is Q-DESIGN-12. |')
                  out.append('| Q-DESIGN-12 | Design Sol / Director | ACTIVE | Materialize the deterministic 16-specimen labeled F1 refinement comparison, run structural/reduced-motion preflight, then conduct direct Design Sol + Director thought adjudication. | Preserve the Q-DESIGN-11 contract exactly: 12 F1A/B/C specimens + 4 unchanged F4 references; no F5/family redesign, arbitrary-list generalization, false loading/progress/priority/causal semantics, production tokens, Stage motion, app implementation, website deployment or Phase-C convergence. External reviewers are not required by default under current design-workflow law. | Clean comparison/preflight plus documented Director + Design Sol resolution selects a provisional F1 cadence reference or records the contract-defined correction decision. |')
                  replaced = True
              else:
                  out.append(line)
          if not replaced:
              raise SystemExit('Q-DESIGN-11 row not found')
          q.write_text('\n'.join(out) + '\n', encoding='utf-8')

          s = Path('CURRENT_STATE.md')
          st = s.read_text(encoding='utf-8')
          old = 'Q-DESIGN-10 DONE by Director + Design Sol adjudication; F1 Ordered Stagger is provisional design incumbent; Q-DESIGN-11 ACTIVE. This design-workflow change does not alter E0 blind scoring or engineering order.'
          new = 'Q-DESIGN-11 DONE; Q-DESIGN-12 ACTIVE for deterministic F1 refinement comparison/preflight and direct Director + Design Sol adjudication. F1 remains provisional; E0 blind scoring and engineering order unchanged.'
          if old not in st:
              raise SystemExit('Cross-lane continuity sentence not found')
          st = st.replace(old, new, 1)
          s.write_text(st, encoding='utf-8')
          PY

          git rm .github/workflows/tmp-design-q12-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md docs/PROJECT_EXECUTION_QUEUE.md
          git commit -m 'Materialize Q-DESIGN-12 queue transition'
          git push origin HEAD:tmp/design-q12-queue-materialize
