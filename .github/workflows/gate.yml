name: Validation gate

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compiler:
    name: Compiler gate (ARM64 cross-compile)
    runs-on: ubuntu-latest
    # Compiler authority only: this proves the checkout builds for the pinned
    # win-arm64 / ARM64 target. Native Windows ARM64 execution is a later rung.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.317'
      - run: dotnet build src/Ensemble.E0.Core/Ensemble.E0.Core.csproj -c Release
      - run: dotnet build src/Ensemble.E0.Harness/Ensemble.E0.Harness.csproj -c Release
      - run: dotnet build tests/Ensemble.E0.Core.Tests/Ensemble.E0.Core.Tests.csproj -c Release
      - run: dotnet build tests/Ensemble.E0.Harness.Tests/Ensemble.E0.Harness.Tests.csproj -c Release

  core-tests:
    name: Core tests (advisory, x64, non-authoritative)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.317'
      - run: dotnet test tests/Ensemble.E0.Core.Tests/Ensemble.E0.Core.Tests.csproj -c Release

  oracle-documentation-drift:
    name: Oracle documentation drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate index and reject drift or lost assertions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          baseline="$BASE_SHA"
          if [[ -z "$baseline" || "$baseline" =~ ^0+$ ]]; then
            baseline=origin/main
          fi
          python tools/oracle-index.py --check --baseline "$baseline"
