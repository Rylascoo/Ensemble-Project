name: Temporary CS2 deployment-envelope queue reconcile

on:
  push:
    branches:
      - queue/cs2-deployment-envelope-activation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: queue/cs2-deployment-envelope-activation
      - name: Reconcile design queue and continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          state = Path('CURRENT_STATE.md')
          s = state.read_text()
          old = 'Q-DESIGN-14 DONE; Q-DESIGN-15 ACTIVE for non-production context-shift motion differentiation under Website authority. F1A 70/460 remains provisional within-context succession; context shifts require a distinct non-sequential treatment. E0 blind scoring and engineering order unchanged.'
          new = 'Q-DESIGN-15 DONE; Q-DESIGN-16 ACTIVE for non-production CS2 deployment-envelope definition under Website authority. F1A 70/460 remains provisional within-context succession; CS2 Balanced Crossfade Exchange is provisional for eligible context shifts. E0 blind scoring and engineering order unchanged.'
          if old not in s:
              raise SystemExit('expected CURRENT_STATE cross-lane sentence not found')
          s = s.replace(old, new, 1)
          state.write_text(s)

          queue = Path('docs/PROJECT_EXECUTION_QUEUE.md')
          lines = queue.read_text().splitlines()
          out = []
          found = False
          for line in lines:
              if line.startswith('| Q-DESIGN-15 |'):
                  found = True
                  out.append('| Q-DESIGN-15 | Design Sol / Director | DONE | Defined, materialized and browser-preflighted the non-sequential context-shift comparison, then resolved it through direct Design Sol + Director adjudication. | Closed on `Rylascoo/Ensemble-Website/main` at `b66bb1b47c407d213c092d20ec603c1a9d56e5ca`; `docs/evidence/MOT_01_CONTEXT_SHIFT_CS2_ADJUDICATION_01.json` and Design Ledger L-049 preserve the 16/16 FULL + 16/16 REDUCED preflight and the convergent CS2 selection. Comparison timing/easing remained fixture-only. | **CS2 — Balanced Crossfade Exchange** is the provisional shared-brand treatment for eligible genuine context replacement; F1A remains bounded within-context succession. Successor is Q-DESIGN-16. |')
                  out.append('| Q-DESIGN-16 | Design Sol / Director | ACTIVE | Freeze and test the bounded CS2 deployment envelope: eligible context-shift classes, CUT fallback, repetition/interruption/retarget behavior, F1A relationship, reduced-motion equivalence and explicit prohibited uses. | Website Q-DESIGN-15 closure at `b66bb1b47c407d213c092d20ec603c1a9d56e5ca`. No production timing/easing/opacity tokens; no universal screen-crossfade rule; no app/site/navigation implementation; no F1A retune; no Character/Scene/Stage/Performance/Take/Opportunity motion; no final identity or Phase-C convergence. | Freeze a non-production use-envelope contract, materialize a small neutral allowed/negative-control exemplar set, pass full/reduced-motion preflight, then resolve the envelope through direct Design Sol + Director adjudication. |')
              else:
                  out.append(line)
          if not found:
              raise SystemExit('Q-DESIGN-15 row not found')
          queue.write_text('\n'.join(out) + '\n')
          PY
          test "$(wc -c < CURRENT_STATE.md)" -le 3072
          git rm .github/workflows/tmp-cs2-deployment-envelope-queue.yml
          git add CURRENT_STATE.md docs/PROJECT_EXECUTION_QUEUE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Advance design queue to CS2 deployment envelope'
          git push origin HEAD:queue/cs2-deployment-envelope-activation
