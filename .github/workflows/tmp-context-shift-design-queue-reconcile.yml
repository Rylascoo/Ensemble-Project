name: Temporary context-shift design queue reconcile

on:
  push:
    branches:
      - tmp/context-shift-design-queue-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Reconcile design queue and continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tmp_context_shift_queue_reconcile.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md docs/PROJECT_EXECUTION_QUEUE.md
          git commit -m 'Advance design queue to context-shift differentiation'
          git push origin HEAD:tmp/context-shift-design-queue-reconcile
