name: Temporary context-shift design queue reconcile

on:
  push:
    branches:
      - tmp/context-shift-design-queue-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Reconcile design queue and continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64,pathlib; p=pathlib.Path('docs/PROJECT_EXECUTION_QUEUE.md'); t=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new))"
          python3 -c "import base64,pathlib; p=pathlib.Path('CURRENT_STATE.md'); t=p.read_text(); old=base64.b64decode('US1ERVNJR04tMTMgRE9ORTsgUS1ERVNJR04tMTQgQUNUSVZFIGZvciBub24tcHJvZHVjdGlvbiBGMUEgZGVwbG95bWVudC1lbnZlbG9wZSBleGVtcGxhcnMgKyBkaXJlY3QgRGlyZWN0b3IvRGVzaWduIFNvbCBhZGp1ZGljYXRpb24uIEYxQSA3MC80NjAgcmVtYWlucyBwcm92aXNpb25hbDsgRTAgYmxpbmQgc2NvcmluZyBhbmQgZW5naW5lZXJpbmcgb3JkZXIgdW5jaGFuZ2VkLg==').decode(); new=base64.b64decode('').decode(); assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new))"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md docs/PROJECT_EXECUTION_QUEUE.md
          git commit -m 'Advance design queue to context-shift differentiation'
          git push origin HEAD:tmp/context-shift-design-queue-reconcile
